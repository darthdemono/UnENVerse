[package]
name    = "unv-app"
version = "0.56.0"
edition = "2021"
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[features]
default = ["connectors", "destinations"]
connectors = []
destinations = []
aws = []

[dependencies]
vault-core = { path = "../vault-core", features = ["tls", "telemetry"] }
tracing    = "0.1"
clap       = { version = "4", features = ["derive", "env"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword  = "7"
dirs       = "7"
# Blocking HTTP client for remote-mode operations. `default-features = false`
# keeps the CLI, desktop app and shared verifier on the same rustls stack.
reqwest      = { version = "0.13", default-features = false, features = ["json", "form", "blocking", "rustls-no-provider"] }
notify       = "8"
uuid         = { version = "1", features = ["v4"] }
aes-gcm      = "0.11"
pbkdf2       = { version = "0.13", default-features = false, features = ["hmac"] }
sha2         = "0.11"
hex          = "0.4"
hmac         = "0.13"
base64       = "0.23"
rand         = "0.10"
time         = { version = "0.3.55", features = ["parsing"] }
chrono       = "0.4"
aho-corasick = "1"
walkdir      = "2"
jiff         = "0.2"
tokio        = { version = "1", features = ["sync", "rt-multi-thread", "net", "io-util", "fs", "time"] }
rusqlite     = { version = "=0.40.2", features = ["sqlcipher"] }
russh        = "0.64.1"
russh-sftp   = "3.0.1"
# Reads KeePass KDBX3/4 directly.  The importer is read-only and retains every
# source attachment in the encrypted migration store.
keepass      = { version = "0.15", features = ["save_kdbx4"] }
# Bitwarden's attachment export and 1Password's .1pux are ZIP containers.  Keep
# only DEFLATE enabled: accepting formats we do not need broadens the parser's
# attack surface without helping either documented source format.
flate2       = "1"
ed25519-dalek = "3"
tar          = "0.4"
zip          = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
