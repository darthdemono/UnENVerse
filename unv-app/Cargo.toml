[package]
name    = "unv-app"
version = "0.43.0"
edition = "2021"
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[features]
default = ["connectors", "destinations"]
connectors = []
destinations = []
aws = []

[dependencies]
vault-core = { path = "../vault-core", features = ["tls", "telemetry"] }
tracing    = "0.1"
clap       = { version = "4", features = ["derive", "env"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword  = "7"
dirs       = "7"
# Blocking HTTP client for remote-mode operations. `default-features = false`
# keeps the CLI, desktop app and shared verifier on the same rustls stack.
reqwest      = { version = "0.13", default-features = false, features = ["json", "form", "blocking", "rustls-no-provider"] }
notify       = "8"
uuid         = { version = "1", features = ["v4"] }
aes-gcm      = "0.11"
pbkdf2       = { version = "0.13", default-features = false, features = ["hmac"] }
sha2         = "0.11"
hex          = "0.4"
hmac         = "0.13"
base64       = "0.23"
rand         = "0.10"
time         = { version = "0.3.55", features = ["parsing"] }
aho-corasick = "1"
walkdir      = "2"

[lints]
workspace = true
