name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets, vault files or `--reveal` output. For a security
        problem use the private reporting form instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `unv --version`
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it happens
      options: [Desktop app, unv CLI, unv-server, Website, Other]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Fedora 44, Windows 11, ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
