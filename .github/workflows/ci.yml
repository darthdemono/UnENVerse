name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Advisories appear without any code change, so `cargo deny` also runs weekly.
  schedule:
    - cron: "41 5 * * 1"
  # R02: Build & Release calls this workflow as its first job, so a release can
  # only start from a SHA whose CI passed *in the same run*. `gate` marks that
  # call: it gets its own concurrency group and is never cancelled.
  workflow_call:
    inputs:
      gate:
        description: Called by Build & Release as a release gate
        type: boolean
        default: false

# Least privilege: nothing here writes to the repo. Build & Release asks for
# more, in the one job that needs it.
permissions:
  contents: read

concurrency:
  # A superseded push has nothing to tell us; cancel it and free the runner. The
  # release gate is the exception: its group differs from the push-triggered run
  # on the same ref (or the two would cancel each other), and cancelling it would
  # make a release depend on which push landed last.
  group: ci-${{ github.ref }}-${{ inputs.gate && 'gate' || 'push' }}
  cancel-in-progress: ${{ !inputs.gate }}

env:
  CARGO_TERM_COLOR: always

# Warnings are denied via `[workspace.lints.rust]` in the root Cargo.toml, not
# via RUSTFLAGS here. RUSTFLAGS would apply to dependencies too, so a warning in
# a platform-specific crate like `windows-sys` or `openssl-src` would fail this
# job with nothing in the repository to fix. It also means `cargo check` locally
# enforces exactly what CI enforces.
#
# Consequence: with no RUSTFLAGS set, `.cargo/config.toml` is no longer
# overridden, so its `-fuse-ld=mold` applies on Linux and mold has to be
# installed below — the same thing Build & Release already does.

jobs:
  # Decides what the rest has to run. A change that only touches documentation
  # (README, policies, licence, screenshots, issue templates) needs no build at
  # all; a change that only touches website/ needs the frontend tests (they build
  # the site against a fake release) but not the Rust jobs. Everything else, the
  # release gate, manual runs and the weekly schedule run it all.
  #
  # Skipping is done here rather than with `paths:` on the trigger because the
  # `CI result` job below must always report: a required check that never starts
  # leaves a documentation-only pull request waiting forever.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      crates: ${{ steps.classify.outputs.crates }}
      frontend: ${{ steps.classify.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify the changed files
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GATE: ${{ inputs.gate }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          everything() {
            { echo "rust=true"; echo "frontend=true"; echo "crates=--workspace"; } >> "$GITHUB_OUTPUT"
            echo "Running everything: $1"
            exit 0
          }
          # `inputs.gate` is set by the release gate; its event name is the caller's.
          if [ "$GATE" = "true" ]; then everything "release gate"; fi
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) everything "event $EVENT" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            everything "no comparable base commit"
          fi
          files=$(git diff --name-only "$base" "$HEAD_SHA")
          docs='^(README|CHANGELOG|CONTRIBUTING|CODE_OF_CONDUCT|GOVERNANCE|SECURITY|ARCHITECTURE|THREAT_MODEL)\.md$|^(LICENSE|NOTICE|codecov\.yml|osv-scanner\.toml|vex\.openvex\.json)$|^Screenshots/|^\.github/ISSUE_TEMPLATE/|^\.github/pull_request_template\.md$'
          not_docs=$(printf '%s' "$files" | grep -Ev "$docs" || true)
          not_site=$(printf '%s' "$not_docs" | grep -Ev '^website/' || true)
          frontend=false; rust=false
          if [ -n "$not_docs" ]; then frontend=true; fi
          # Which Rust crates need their tests. Dependencies run one way,
          # vault-core -> unv-app -> unv-server -> unv-cli and the desktop crate
          # (package `unenverse`), so a change tests the crate and everything that
          # builds on it. Anything that is not clearly one crate or clearly
          # TypeScript (manifests, lockfile, CI, scripts, fixtures, Docker) tests
          # the whole workspace.
          ts_only='^(src/|tests/[^/]+\.ts$|ui-lab/|public/|index\.html$|vscode-extension/|(vitest|eslint|vite|playwright)\.config\.[jt]s$|\.prettier|tsconfig\.json$|package(-lock)?\.json$)'
          other=$(printf '%s' "$not_site" | grep -Ev "$ts_only" || true)
          crates=""
          add() { case " $crates " in *" $1 "*) ;; *) crates="$crates $1" ;; esac; }
          whole=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              vault-core/*) whole=true ;;
              unv-app/*) add unv-app; add unv-server; add unv-cli; add unenverse ;;
              unv-server/*) add unv-server; add unv-cli; add unenverse ;;
              unv-cli/*) add unv-cli ;;
              src-tauri/*) add unenverse ;;
              *) whole=true ;;
            esac
          done <<< "$other"
          if [ "$whole" = true ]; then
            crates="--workspace"
          else
            crates=$(printf '%s' "$crates" | sed -E 's/ ([a-z-]+)/ -p \1/g; s/^ //')
          fi
          if [ -n "$crates" ]; then rust=true; fi
          printf 'changed files:\n%s\n' "$files"
          echo "frontend=${frontend} rust=${rust} crates=${crates}"
          echo "crates=${crates}" >> "$GITHUB_OUTPUT"
          { echo "rust=${rust}"; echo "frontend=${frontend}"; } >> "$GITHUB_OUTPUT"

  # `test` and `lint` used to be one `rust` job whose steps ran back to back, so
  # Windows paid test (18 min) + `cargo check --all-targets` (10 min) + clippy in
  # sequence: 32 min in the last green run. They are separate jobs now and run
  # side by side. `cargo check --all-targets` is gone: clippy `--all-targets`
  # compiles the same code with the same flags and reports strictly more.
  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should still report the other, or a Windows-only
      # break hides behind a green Linux run and vice versa.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: test
          components: ""

      # `--locked` below refuses to build if a Cargo.toml edit was committed
      # without the matching Cargo.lock. Saying so here beats a resolver error
      # buried in the test job's output.
      - name: Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1

      # vault-core holds the crypto, storage and RBAC logic; unv-server holds the
      # session and LAN-hosting logic. Regressions in either are security bugs
      # rather than cosmetic ones.
      # Only the crates the change can affect (see `changes`); the whole workspace
      # for anything it cannot place, the release gate and manual runs.
      - name: Test
        shell: bash
        env:
          CRATES: ${{ needs.changes.outputs.crates }}
        run: |
          read -ra pkgs <<< "$CRATES"
          cargo test "${pkgs[@]}" --locked --verbose --no-fail-fast

  # arm64 Linux: informational, deliberately not in `ci-ok`'s needs. It shows
  # whether the Rust tests pass on aarch64 before the release job ships arm64
  # binaries; promote it into `ci-ok` once it has been green for a while.
  test-arm64:
    name: Test (linux-arm64)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: test-arm64
          components: ""
      - name: Test
        shell: bash
        env:
          CRATES: ${{ needs.changes.outputs.crates }}
        run: |
          read -ra pkgs <<< "$CRATES"
          cargo test "${pkgs[@]}" --locked --no-fail-fast

  lint:
    name: Lint (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: lint
          components: clippy, rustfmt

      # Prebuilt binary, pinned to a version: `cargo install` compiled it from
      # source on every run. 0.18.5 cannot parse the advisory database's CVSS 4.0
      # scores ("unsupported CVSS version"), hence the floor.
      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2

      - name: Dependency policy (cargo-deny)
        if: runner.os == 'Linux'
        run: cargo deny check advisories bans licenses sources

      # Formatting is platform-independent, so checking it on both runners would
      # pay twice for the same answer. `--check` prints a diff and exits
      # non-zero; it never rewrites the tree.
      - name: Formatting (rustfmt)
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # Clippy runs on both, because the lints that matter here are behind
      # `cfg`: vault-core vendors SQLCipher and OpenSSL only on Windows, and
      # unv-cli's process-spawning code takes a different branch there. A
      # Linux-only clippy would never see either.
      #
      # No `-D warnings` on the command line: the levels live in the root
      # Cargo.toml under `[workspace.lints.clippy]`, so `cargo clippy` locally
      # enforces exactly what this line does. Passing the flag here as well
      # would apply it to dependencies too.
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets

      # The portable build path (SQLCipher and OpenSSL compiled in) is what
      # release artefacts use, so it has to be exercised somewhere. Checking it
      # on Linux catches a broken feature union without paying for it on both.
      - name: Check the bundled (distro-independent) build
        if: runner.os == 'Linux'
        run: cargo check -p vault-core --locked --features bundled

  frontend:
    name: Frontend (typecheck + test + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      # Job level so the Codecov step's `if` can see it (a step's own env is not
      # visible to its own condition).
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      # First, because it is the cheapest and the one whose failure invalidates
      # a release rather than a commit. The version is stated in eight files and
      # nothing else in this workflow reads more than one of them.
      - name: Version numbers agree
        run: npm run version:check

      # `--check` only reports. Reformatting in CI and committing the result
      # would mean the tree on disk never matches the tree that was reviewed.
      - name: Formatting (Prettier)
        run: npm run format:check

      # `eslint-suppressions.json` records the 237 pre-existing violations this
      # config found when it was introduced, so this step passes today and
      # fails on anything NEW. Fix some of the backlog and run
      # `npx eslint --prune-suppressions` to shrink the file — never regenerate
      # it wholesale with `--suppress-all`, which would silently absorb real
      # regressions along with the old debt.
      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Same suite as `npm test`, with V8 coverage and the floor from
      # vitest.config.ts: a drop below it fails here.
      - name: UI tests (with coverage)
        run: npm run test:coverage

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      # Feeds the Codecov badge. Skipped where the token is absent (forks, and
      # the release gate unless the caller passes secrets), so it can never turn a
      # green run red: the coverage floor above is the real gate.
      - name: Send coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: typescript
          fail_ci_if_error: false

      - name: Build
        run: npx vite build

      - name: VS Code extension builds and packages
        run: |
          cd vscode-extension
          npm ci
          npm run package

  # The one check branch protection requires. It always runs and passes only when
  # every job it needs either succeeded or was skipped on purpose by `changes`;
  # a failed or cancelled job, or a failed `changes`, fails it.
  ci-ok:
    name: CI result
    if: ${{ always() }}
    needs: [changes, test, lint, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded or was skipped
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a CI job ended as '${r}'"; exit 1 ;;
            esac
          done
