name: Fuzz

# Runs every libFuzzer target in fuzz/ for a short, fixed time. Weekly and on demand only: it
# is not part of the required `CI result` check. A crash fails the job and uploads the input.
on:
  schedule:
    - cron: "29 5 * * 3"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "60"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - env_names
          - migrate_env
          - migrate_compose
          - migrate_wireguard
          - migrate_nginx
          - password_source_json_zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The vault links the system SQLCipher; `.cargo/config.toml` asks for mold on gnu.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlcipher-dev mold
      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal --target x86_64-unknown-linux-gnu
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-fuzz@0.13.1
      - name: Run the target
        working-directory: fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '60' }}
          TARGET: ${{ matrix.target }}
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- -max_total_time="$SECONDS_PER_TARGET"
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
