name: Security audit

# Free scanners that complement CodeQL, cargo-deny and the OpenSSF Scorecard. Each job answers
# one question and is informational until it has run clean a few times: none of them is part of
# the required `CI result` check, so a noisy rule never blocks a pull request.
#
#   gitleaks     a secret committed anywhere in the history
#   zizmor       an unsafe pattern in a workflow (injection, over-broad permissions, unpinned actions)
#   hadolint     a Dockerfile mistake
#   trivy        known vulnerabilities, misconfigurations and secrets in the repository files
#   osv          known vulnerabilities in the two lockfiles, from the OSV database
#   semgrep      code patterns from the open-source rule packs (Rust, TypeScript, Docker, secrets)
#   npm          the registry signatures and provenance of every installed npm package
#   dependency   a pull request that adds a dependency with a known vulnerability or a bad licence

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets in history (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  zizmor:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

  hadolint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  trivy:
    name: Files and config (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Fixtures and the local viewer image hold deliberately unsafe examples (a Kubernetes
          # Deployment without a read-only root, and Stripe-shaped test strings the redaction
          # engine is tested against), so they are not scanned.
          skip-dirs: tests/fixtures,tools,target,node_modules
          skip-files: unv-app/src/exposure.rs,unv-app/src/matlog.rs
          exit-code: "1"

  osv:
    name: Lockfiles (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --lockfile=package-lock.json
            --config=osv-scanner.toml

  semgrep:
    name: Code patterns (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install semgrep
        run: pip install --no-cache-dir semgrep==1.182.0
      # `temp-dir` is excluded because every remaining use is inside a test module that makes a
      # per-test unique directory; tests/rust-hygiene.test.ts fails if production code gains one.
      - name: Scan
        run: |
          semgrep scan --error --metrics=off --quiet \
            --config p/rust --config p/typescript --config p/javascript \
            --config p/dockerfile --config p/github-actions --config p/secrets \
            --exclude-rule rust.lang.security.temp-dir.temp-dir \
            --exclude node_modules --exclude target --exclude dist --exclude website/assets \
            --exclude tests/fixtures --exclude handoff --exclude fuzz .

  npm-signatures:
    name: npm provenance (npm audit signatures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit signatures

  dependency-review:
    name: New dependencies (dependency review)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Needs the repository's Dependency graph switched on (Settings, Advanced Security); until
    # then the action reports "not supported" and this job must not turn the run red.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
