name: Rust coverage

# Measures statement coverage of the whole Rust workspace on a runner, so nobody
# has to run `cargo llvm-cov` locally. It is not part of `CI result`: it runs on
# every push to main that touches Rust (so Codecov has a base for pull request
# patch coverage), weekly, and on demand. The figures land in
# the job summary, the `rust-coverage` artifact and, when CODECOV_TOKEN is set,
# Codecov under the `rust` flag.
on:
  push:
    branches: [main]
    paths:
      - "vault-core/**"
      - "unv-app/**"
      - "unv-cli/**"
      - "unv-server/**"
      - "src-tauri/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/coverage-rust.yml"
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: coverage
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1

      # Tests and fuzz targets are not production code; their lines would only
      # inflate the figure. UNV_* must be unset: a set value sends `unv` to a real
      # server.
      - name: Measure
        run: |
          mkdir -p coverage-rust
          env -u UNV_SERVER_URL -u UNV_PASSWORD cargo llvm-cov --workspace --locked \
            --ignore-filename-regex '(^|/)(tests|fuzz)/' \
            --json --summary-only --output-path coverage-rust/summary.json
          env -u UNV_SERVER_URL -u UNV_PASSWORD cargo llvm-cov report \
            --ignore-filename-regex '(^|/)(tests|fuzz)/' \
            --lcov --output-path coverage-rust/lcov.info

      - name: Summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          t = json.load(open("coverage-rust/summary.json"))["data"][0]["totals"]
          print("## Rust coverage\n\n| | covered | total | percent |\n| --- | --- | --- | --- |")
          for k in ("lines", "functions", "regions"):
              print(f"| {k} | {t[k]['covered']} | {t[k]['count']} | {t[k]['percent']:.2f} |")
          PY

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: coverage-rust/
          if-no-files-found: ignore

      - name: Send coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-rust/lcov.info
          flags: rust
          fail_ci_if_error: false

  # Branch coverage needs the nightly compiler (`--branch` is unstable), so it is a
  # separate job: it measures the same tests with a second toolchain and never
  # affects the line figures above. Weekly and on demand only, to keep pushes cheap.
  branches:
    name: Rust branch coverage (nightly)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: coverage-branches
          components: llvm-tools-preview

      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Measure branches
        run: |
          mkdir -p coverage-rust-branches
          env -u UNV_SERVER_URL -u UNV_PASSWORD cargo +nightly llvm-cov --branch --workspace --locked \
            --ignore-filename-regex '(^|/)(tests|fuzz)/' \
            --json --summary-only --output-path coverage-rust-branches/summary.json

      # Per-branch records (BRDA lines) so the uncovered branches can be named, not just counted.
      - name: Export per-branch records
        run: |
          cargo +nightly llvm-cov report --branch \
            --ignore-filename-regex '(^|/)(tests|fuzz)/' \
            --lcov --output-path coverage-rust-branches/lcov.info

      - name: Summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          t = json.load(open("coverage-rust-branches/summary.json"))["data"][0]["totals"]
          print("## Rust branch coverage (nightly)\n\n| | covered | total | percent |\n| --- | --- | --- | --- |")
          for k in ("lines", "branches", "regions"):
              print(f"| {k} | {t[k]['covered']} | {t[k]['count']} | {t[k]['percent']:.2f} |")
          PY

      - name: Upload the branch report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-branch-coverage
          path: coverage-rust-branches/
          if-no-files-found: ignore
