[package]
name    = "unv-cli"
version = "0.60.1"
edition = "2021"
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[lib]
name = "unv_cli"
path = "src/lib.rs"

[[bin]]
name = "unv"
path = "src/main.rs"

[features]
# AWS Secrets Manager and Parameter Store imports: a commercial service, off by default.
aws = ["unv-app/aws"]

[dependencies]
unv-app      = { path = "../unv-app" }
vault-core   = { path = "../vault-core", features = ["tls", "telemetry"] }
tracing      = "0.1"
clap         = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde_json   = "1"

# Deny warnings, per [workspace.lints.rust] at the repo root.
[lints]
workspace = true

# The behaviour tests that exercise `user`, `class`, `perm`, tokens and nodes run
# the real `unv` binary against a real `unv-server` started in-process.
[dev-dependencies]
unv-server = { path = "../unv-server" }
axum       = "0.8"
tokio      = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
keepass    = { version = "0.17", features = ["save_kdbx4"] }
