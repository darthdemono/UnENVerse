[package]
name    = "unv-cli"
version = "0.43.0"
edition = "2021"
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[lib]
name = "unv_cli"
path = "src/lib.rs"

[[bin]]
name = "unv"
path = "src/main.rs"

[dependencies]
unv-app      = { path = "../unv-app" }
vault-core   = { path = "../vault-core", features = ["tls", "telemetry"] }
tracing      = "0.1"
clap         = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde_json   = "1"

# Deny warnings, per [workspace.lints.rust] at the repo root.
[lints]
workspace = true
