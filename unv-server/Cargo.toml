[package]
name    = "unv-server"
version = "0.57.0"
edition = "2021"
rust-version.workspace = true
publish = false
license = "Apache-2.0"

# Library first: the desktop app embeds this router for "Open to LAN", so the
# binary is only a CLI wrapper around it.
[lib]
name = "unv_server"
path = "src/lib.rs"

[[bin]]
name = "unv-server"
path = "src/main.rs"

[dependencies]
vault-core   = { path = "../vault-core", features = ["telemetry"] }
# The hub renders targets through the shared application engine. Connector and
# destination features stay out of the server binary until it owns a caller.
unv-app     = { path = "../unv-app", default-features = false }
tracing      = "0.1"
axum         = "0.8"
axum-server  = { version = "0.8", features = ["tls-rustls"] }
tokio        = { version = "1", features = ["full"] }
tower-http   = { version = "0.7", features = ["cors"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
uuid         = { version = "1", features = ["v4"] }
zeroize      = "1.9"
clap         = { version = "4", features = ["derive"] }
dirs         = "7"
utoipa       = { version = "6", features = ["axum_extras"] }
rcgen        = "0.14"
rustls-pki-types = "1"
# Direct dependency purely so main() can install a process-level CryptoProvider.
# Needed because the workspace now enables two providers on one rustls: axum-server
# pulls `ring`, and vault-core's `tls` feature pulls `aws_lc_rs`. Cargo unifies
# features across a build, rustls then refuses to guess, and the server panics on
# startup. Choosing explicitly is the fix; leaving it to the default is a bug that
# only appears once some *other* crate in the workspace grows a TLS dependency.
rustls         = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
sha2         = "0.11"
base64       = "0.23"
hex          = "0.4"
time         = "0.3.55"

# Deny warnings, per [workspace.lints.rust] at the repo root.
[lints]
workspace = true

[dev-dependencies]
# Drives the real router with `oneshot`, so route tests exercise the path,
# method, extractors and middleware — not just the handler function.
tower = { version = "0.5", features = ["util"] }
